<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#1c2436"/>
      <stop offset="60%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </radialGradient>
    <linearGradient id="accent" x1="6" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="40%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#2478c7"/>
    </linearGradient>
    <linearGradient id="ring" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b9eff" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b9eff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="url(#ring)" stroke-width="1.25"/>

  <!-- Subtle top highlight -->
  <ellipse cx="13" cy="5" rx="9" ry="3" fill="#ffffff" fill-opacity="0.04"/>

  <!-- KK monogram -->
  <g stroke="url(#accent)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
    <path d="M7.5 9.5v13M7.5 16l5.25-6.5M7.5 16l5.25 6.5"/>
    <path d="M15.5 9.5v13M15.5 16l5.25-6.5M15.5 16l5.25 6.5"/>
  </g>

  <!-- Online status -->
  <circle cx="25.5" cy="6.5" r="4" fill="#34d399" fill-opacity="0.16"/>
  <circle cx="25.5" cy="6.5" r="2.1" fill="#34d399"/>
  <circle cx="24.9" cy="5.9" r="0.65" fill="#d1fae5" fill-opacity="0.85"/>
</svg>
