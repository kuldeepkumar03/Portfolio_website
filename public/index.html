<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0c0f14">
  <title>Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-loader" id="pageLoader" aria-hidden="true">
    <span class="page-loader__mark">KK</span>
    <div class="page-loader__track">
      <div class="page-loader__bar"></div>
    </div>
  </div>

  <div class="scroll-progress" id="scrollProgress" aria-hidden="true">
    <div class="scroll-progress__fill" id="scrollProgressFill"></div>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor__dot"></span>
    <span class="cursor__ring"></span>
  </div>

  <header class="nav" id="nav">
    <div class="container nav__bar">
      <div class="nav__inner">
        <a href="#home" class="nav__brand" data-scroll="home" aria-label="Kuldeep Kumar — Home">
          <span class="nav__logo" aria-hidden="true">
            <img class="nav__logo-img" id="navLogo" src="images/logo.svg" alt="" width="40" height="40">
          </span>
          <span class="nav__brand-text">
            <span class="nav__brand-name" id="navBrandName"></span>
            <span class="nav__brand-role" id="navBrandRole"></span>
          </span>
        </a>

        <nav class="nav__links" id="navLinks" aria-label="Main navigation">
          <div class="nav__pill" id="navPill"></div>
        </nav>

        <div class="nav__actions">
          <a href="resume.pdf" class="btn btn--nav-resume nav__resume" id="resumeBtn" target="_blank" rel="noopener">
            <span>Resume</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <button class="nav__toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero__media">
        <video class="hero__video" id="heroVideo" playsinline preload="auto">
          <source src="" type="video/mp4">
        </video>
        <div class="hero__media-overlay"></div>
        <div class="hero__terminal-wrap" id="heroTerminal"></div>
        <div class="media-controls" id="videoControls" aria-label="Video controls">
          <div class="media-controls__bar">
            <button class="media-controls__btn" id="videoToggle" type="button" aria-label="Play video">
              <svg class="icon-play" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 2.5v11l9-6.5-9-4.5z" fill="currentColor"/>
              </svg>
              <svg class="icon-pause" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="3.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/>
                <rect x="9.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/>
              </svg>
            </button>
            <span class="media-controls__divider" aria-hidden="true"></span>
            <button class="media-controls__btn" id="muteToggle" type="button" aria-label="Unmute video">
              <svg class="icon-muted" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2.5 5.5v5h2.5l3.5 2.5V3L5 5.5H2.5z" fill="currentColor"/>
                <path d="M11.5 6l2.5 2.5M14 6l-2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <svg class="icon-unmuted" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2.5 5.5v5h2.5l3.5 2.5V3L5 5.5H2.5z" fill="currentColor"/>
                <path d="M11.5 6.5c1 0.9 1.5 2 1.5 3s-0.5 2.1-1.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="media-controls__progress" aria-hidden="true">
            <div class="media-controls__progress-fill" id="videoProgress"></div>
          </div>
        </div>
      </div>

      <div class="container hero__content" id="heroContent"></div>

      <div class="ticker" aria-hidden="true">
        <div class="ticker__track" id="heroTickerTrack"></div>
      </div>
    </section>

    <section id="about" class="section"></section>
    <section id="experience" class="section section--alt"></section>
    <section id="projects" class="section"></section>
    <section id="writing" class="section section--alt"></section>
    <section id="contact" class="section section--alt"></section>
  </main>

  <button class="back-top" id="backTop" type="button" aria-label="Back to top" aria-hidden="true" tabindex="-1">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 14V4M9 4L5 8M9 4l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="project-modal" id="projectModal" hidden aria-hidden="true">
    <div class="project-modal__backdrop" data-modal-close></div>
    <div class="project-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <button class="project-modal__close" type="button" data-modal-close aria-label="Close project details">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 5l8 8M13 5l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="project-modal__content" id="projectModalContent"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__inner" id="footerInner"></div>
  </footer>

  <script src="js/script.js" type="module"></script>
</body>
</html>
